# This repository is a published snapshot and doesn't take contributions:
# pull requests from anyone but the owner are closed with a short note.
name: Close outside pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR" --comment "Thanks! This repository is a published snapshot of StoryMode and doesn't accept contributions (see CONTRIBUTING.md). You're welcome to fork it and change it however you like."
